# Network Monitor configuration
# Format: key = value   (lines starting with # are comments)
# Restart the monitor after editing this file.

# --- Web interface ---
port = 8080
open_browser = yes

# --- Checks ---
interval_seconds = 10
pings_per_check = 4
# Average latency above this value (ms) marks a check as DEGRADED
latency_warning_ms = 80

# --- Internet / ISP ---
isp_name = Claro
# Hosts pinged to test Internet connectivity (comma-separated)
internet_targets = 1.1.1.1, 8.8.8.8
# Host name resolved to test DNS (also used for the HTTPS check)
dns_test_host = google.com

# --- Router / gateway ---
router_name = REDACTED
router_ip = REDACTED
# TCP port of the router's web interface (0 disables this check)
router_web_port = REDACTED

# --- Access points (one line each) ---
# access_point = <ip>, <display name>
# Leave the IP empty if unknown, e.g.:  access_point = , Deco #2
# The IPs below were found in this PC's ARP table on 2026-10-07;
# confirm in the Deco app which IP belongs to which unit.
access_point = REDACTED
access_point = REDACTED
